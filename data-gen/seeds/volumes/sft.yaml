# Sample counts for SFT. Edit here, then re-run `python seeds/build_seeds.py`.
# Counts are CONVERSATIONS (3-6 user turns each, 2-4 tasks each, ending on the assistant).
#
# SFT now teaches COMPETENCE, not behaviour: the knowledge-boundary tasks moved to RL, where a preference pair
# can express that an honest admission beats a confident invention. What is left has one good answer --
# explaining how the world works (23% of the phase, the largest block), translating in both directions and
# between the African languages, summarising, labelling, writing. A model that cannot explain how a generator
# works has nothing to be honest about, and this is the phase that fixes that.
kind: sft

yield_by_tier:
  high: 0.92
  medium: 0.85
  low: 0.72

samples_per_language:
  pcm: 60000
  yor: 24000
  hau: 24000
  ibo: 24000
  twi: 18000
  aka: 15000
  efi: 12000
  urh: 12000
  fon: 12000
  ewe: 12000
  ful: 12000
  fuv: 12000
  eng: 13000
  # ---- beyond West Africa. Proportional to L1+L2 speakers, scaled so the largest (Swahili,
  # ~100M) sits at 12,000 -- the SMALLEST volume any Nigerian language has in this phase -- so no
  # added language outranks a home language. French IS population-scaled, on AFRICAN French speakers
  # (~150M) rather than global (~320M): a Parisian speaker is not this corpus's audience, and using
  # the global figure would make French 3.2x Swahili and dominate the added set.
  # Speakers used: fra 150M (Africa), swh 100M, orm 37M, zul 28M, som 24M, kin 15M, sna 15M.
  # ALL EIGHT need the model's vocab_size raised past 52050 before training; see build_seeds.py.
  swh: 8000
  fra: 12000
  orm: 3000
  zul: 2200
  som: 1900
  kin: 1200
  sna: 1200
# total (recomputed by build_seeds.py)
