# Sample counts for SFT. Edit here, then re-run `python seeds/build_seeds.py`.
# Counts are CONVERSATIONS (3-6 user turns each, 2-4 tasks each, ending on the assistant).
#
# SFT now teaches COMPETENCE, not behaviour: the knowledge-boundary tasks moved to RL, where a preference pair
# can express that an honest admission beats a confident invention. What is left has one good answer --
# explaining how the world works (23% of the phase, the largest block), translating in both directions and
# between the African languages, summarising, labelling, writing. A model that cannot explain how a generator
# works has nothing to be honest about, and this is the phase that fixes that.
kind: sft

yield_by_tier:
  high: 0.92
  medium: 0.85
  low: 0.72

samples_per_language:
  pcm: 60000
  yor: 24000
  hau: 24000
  ibo: 24000
  twi: 18000
  aka: 15000
  efi: 12000
  urh: 12000
  fon: 12000
  ewe: 12000
  ful: 12000
  fuv: 12000
  eng: 13000
# total: 250,000
