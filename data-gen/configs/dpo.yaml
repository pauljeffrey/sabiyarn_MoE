# DPO preference pairs (instruction / input / chosen / rejected) via the OpenAI Batch API
#
# Edit this file, then:  python run.py estimate --kind dpo
#                        python run.py build --kind dpo --config configs/dpo.yaml
# Unknown keys are rejected on load (typos fail loudly).

kind: dpo
model: gpt-4o-mini   # weaker than gpt-4o in low-resource languages -- see README
temperature: 0.8
max_tokens: 3500
seed: 20240613

# COST ESTIMATE (Batch API, gpt-4o-mini prices in config/settings.py -- verify current pricing):
#   see `python run.py estimate --kind dpo`;  ~$6.0 total for the preset (about $0.4-0.5 per language; ~23M input + ~14M output tokens)
samples_per_language:
  default: 1500   # pairs per language; 12 languages => 18,000 requests
  yor: 1500
  hau: 1500
  ibo: 1500
  efi: 1500
  urh: 1500
  twi: 1500
  fon: 1500
  pcm: 1500
  ewe: 1500
  aka: 1500
  ful: 1500
  fuv: 1500

system_prompt: "You are a helpful multilingual assistant for speakers of West African languages. Reply in the language the user writes in, clearly and accurately."

domain_group_weights:   # 1.0 = every (domain, sub-topic) pair used equally often; 2.0 = twice as often; 0 = exclude group
  culture_arts: 1.0
  economy: 1.0
  environment: 1.0
  health: 1.0
  knowledge: 1.0
  livelihoods: 1.0
  people: 1.0
  society: 1.0
  tech_infrastructure: 1.0

attribute_weights:
  task:
    open_qa: 1.3
    factual_qa: 1.0
    reading_comprehension: 1.0
    summarization: 1.0
    title_generation: 0.8
    keyword_extraction: 0.8
    translation_en_to_lang: 1.2
    translation_lang_to_en: 1.2
    paraphrase: 0.9
    formality_rewrite: 0.9
    grammar_correction: 0.8
    text_classification: 1.0
    ner_extraction: 0.8
    info_extraction_json: 0.9
    sentence_completion: 0.7
    creative_story: 0.9
    creative_poem: 0.7
    letter_email_drafting: 1.0
    explanation_howto: 1.1
    brainstorming_list: 0.8
    math_word_problem: 1.0
    statistics_simple: 0.7
    commonsense_reasoning: 0.8
    logical_reasoning: 0.6
    dialogue_continuation: 0.8
    proverb_explanation: 0.7
    data_to_text: 0.7
    format_constrained: 1.0
    safe_decline: 0.6
    advice: 1.0
    text_simplification: 0.7
    question_generation: 0.6
    compare_contrast: 0.7
  rejection_type:   # flaw injected into `rejected`; restricted per task (e.g. poor_translation only for translation)
    factual_error: 1.0
    hallucinated_details: 1.0
    ignores_constraint: 1.0
    wrong_language: 1.0
    incomplete: 1.0
    rambling_verbose: 0.9
    unhelpful_refusal: 0.7
    format_violation: 1.0
    tone_mismatch: 0.9
    poor_translation: 0.5
    wrong_label: 0.2
    off_topic: 0.8
  register:
    formal: 1.0
    semi_formal: 1.4
    conversational: 1.4
    colloquial: 0.8
  instruction_style:
    direct_command: 1.0
    polite_request: 1.0
    question_form: 1.0
    terse_keywords: 0.6
    context_first: 0.9
    constraint_included: 0.8
  response_length:
    brief: 0.25
    short: 0.35
    medium: 0.28
    long: 0.12
  difficulty:
    basic: 0.4
    general: 0.45
    advanced: 0.15

quality:
  max_repetition_ratio: 0.25   # share of repeated word 4-grams; above this = degenerate repetition
  max_repeated_line_ratio: 0.35   # share of duplicated lines/sentences
  max_top_token_share: 0.3   # one token making up more than this share of a 30+ word text
  max_english_ratio: 0.15   # share of tokens that are common English stopwords (English-leak filter)
  max_english_ratio_by_language: {pcm: 0.3}   # per-language override; pcm (Nigerian Pidgin) legitimately shares vocabulary (uses a stricter word list too)
  min_english_check_tokens: 8   # texts shorter than this are not leak-checked (too noisy)
  max_non_latin_ratio: 0.2   # share of non-Latin letters => wrong script
  drop_low_confidence: true   # drop records the model itself marked confidence=low
  drop_meta_text: true   # drop 'Here is...', 'As an AI', [...] placeholders, code fences, refusals
  min_instruction_chars: 6
  max_instruction_chars: 1500
  max_input_chars: 5000
  min_response_chars: 50
  max_response_chars: 10000
  min_length_ratio: 0.3   # len(rejected)/len(chosen) lower bound (skipped for length-related flaw types)
  max_length_ratio: 3.0   # upper bound (same exemption)

dedup:
  near_dup_threshold: 0.8   # word-shingle Jaccard at/above which a later record is dropped
  shingle_size: 5
  within_language: true
  cross_language: true   # also dedup across the 12 languages of this kind

judge:   # optional stage, see pipeline/judge.py
  model: gpt-4o-mini   # a stronger judge (e.g. gpt-4o) is more reliable for low-resource languages
  temperature: 0.0
  max_tokens: 300
  sample_fraction: 0.2   # share of records judged per language (1.0 = all)
  min_scores:
    language_correctness: 4
    fluency: 3
    factuality: 3
    instruction_following: 3
    usefulness: 3
  drop_unjudged: false   # records outside the judged sample are kept unless true
