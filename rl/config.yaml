# Post-training preset: DPO on data-gen's dpo.jsonl.  python -m rl.run     (torchrun ... -m rl.run for N GPUs)
# Every key is an RLConfig field (rl/config.py); override any of them as RL_<FIELD>=value or `key=value` on the
# command line. Sections are only for readability.
algo: dpo

model:
  model_path: Aletheia-ng/SabiYarn_MoE-280M   # a checkpoint dir (out_280M/<run>/ckpt_best) or a Hub id: the policy's start
  tokenizer: BeardedMonster/SabiYarn-32k
  model_code: local          # local = sabiyarn/model/*.py from this repo (sparse MoE, flex) | hub
  param_dtype: float32       # fp32 master weights + bf16 autocast, as in training/
  moe_dispatch: sparse
  reference_path: null       # null = frozen copy of the starting policy

data:
  data_path: data-gen/data/processed/dpo.jsonl    # or dataset_id: <hub dataset with the same columns>
  languages: []              # e.g. [yor, hau]; empty = all
  max_samples: 0
  eval_samples: 500
  # MEASURED over 4,736 real data-gen records (SabiYarn-32k, prefix-as-prompt exactly as encode_answer does):
  #   prompt        median 1,260  p90 2,034  p99 6,762  max 13,867
  #   final answer  median    68  p90   121  p99   293  max    716
  # 512/1024 dropped 75.7% of prompts and 70.2% of samples, visible only as a
  # `dpo_examples_dropped_too_long` log line -- a tool-calling conversation carries the tool catalogue in its
  # system message plus several tool results, so it cannot fit 512 tokens. 16384 keeps 100% and matches
  # training/train_config.yaml's sft_block_size.
  max_prompt_len: 15360
  max_seq_len: 16384

train:
  # 1 pair, because max_seq_len is now 16x larger. DPO forwards chosen AND rejected, so a pair is 2 sequences:
  # 1 x 2 x 16,384 = 32,768 tokens per micro-step, inside the ~49k the pretraining config was swept to fit on
  # an A100-80GB. accum 16 keeps the effective batch at the 16 pairs it was before.
  batch_size: 1              # pairs per GPU per micro-step  ->  2 sequences (chosen + rejected) per forward
  grad_accum_steps: 16       # effective batch = 1 x 16 x n_gpus pairs
  epochs: 1
  max_steps: 0
  learning_rate: 5.0e-7      # DPO: 1e-7 .. 1e-6. A ~300M model tolerates the top of that range.
  min_lr: 0.0
  warmup_ratio: 0.1
  scheduler: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  mixed_precision: bf16
  eval_every: 100
  save_every: 500
  log_every: 10

dpo:
  beta: 0.1                  # 0.05 .. 0.5; lower = allowed to move further from the reference
  dpo_loss: sigmoid          # sigmoid | ipo | hinge
  label_smoothing: 0.0
  length_normalize: false
  sft_alpha: 0.0             # try 0.1 if chosen log-probs fall during training

output:
  out_dir: outputs/dpo
  hf_push_repo_id: null      # e.g. Aletheia-ng/SabiYarn_MoE-280M-dpo  (needs HF_WRITE_TOKEN in .env)
  s3_prefix: null
  mlflow: true
  mlflow_tracking_uri: null  # MLFLOW_TRACKING_URI wins; modal_rl.py points it at the volume
  mlflow_experiment: sabiyarn-posttraining
  run_name: null
