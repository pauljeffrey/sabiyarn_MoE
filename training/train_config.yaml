
training: 
  train_batch_size : 6
  # Local/vast.ai: checkpoints go directly under this path. On Modal
  # (training/modal_train.py), this name is instead used as a subdirectory
  # under the persistent "sabiyarn-data" volume -- checkpoints land at
  # /data/<out_dir> there, not at a literal "./<out_dir>" relative to the
  # container's cwd -- so give each distinct experiment/config its own
  # out_dir to keep their checkpoint trees (and latest-checkpoint
  # auto-discovery) from colliding.
  out_dir : "out_280M"
  eval_interval : 150
  log_interval : 100
  eval_iters : 200
  eval_only : false  # if True, script exits right after the first eval
  always_save_checkpoint : true  # if True, always save a checkpoint after each eval
  gradient_accumulation_steps : 32  # used to simulate larger batch sizes (was 5 * 8)
  decay_lr : True  # whether to decay the learning rate
  # LR schedule (training/lr_schedule.py) is a pure function of iter_num. Recommended for a
  # long token-budget run (see HOW_TO_RUN.md "Recommended hyperparameters" for the sources):
  #   wsd    -- warmup, hold the peak, then cool down to min_lr over the last wsd_decay_frac of
  #             max_iters. Any stable-phase checkpoint can be cooled down on its own, so you can
  #             stop early (e.g. at 25B of a planned 50B tokens) without wasting the run.
  #   linear -- straight decay from peak to min_lr at lr_decay_iters (min_lr: 0 = "decay to zero").
  #   cosine -- cosine to min_lr at lr_decay_iters (the old default).
  scheduler: "wsd"  # wsd | linear | cosine
  wsd_decay_frac: 0.2  # fraction of max_iters spent cooling down (0.1-0.2)
  wsd_decay_shape: "sqrt"  # sqrt = (1 - sqrt(t)) cooldown | linear | cosine
  warmup_iters : 1000  # ~0.8B tokens at 786K tokens/step; typical range 0.1-2% of total steps
  lr_decay_iters : 60000  # only used by scheduler: cosine / linear; wsd uses max_iters
  min_lr : 0.0  # final LR. Must stay BELOW optimizer.learning_rate. 0 = decay to zero
  # torch.compile only ever applied to single-GPU runs (multi-process runs skip it), and is untested
  # on this MoE with the current torch/transformers -- a compile error would kill a rented run.
  # Turn it on only after a short single-GPU trial.
  compile : false
  display_model_output_iter : 128
  use_cce : false  # to use cut cross entropy or not
  # Whether to mask prompt/action-span (pretrain) or prompt-vs-response (SFT)
  # tokens out of the loss at all -- see training/label_masking.py. false
  # means every token contributes to the loss, completely unmasked.
  use_loss_mask: false
  block_size: 4096
  # Document-causal attention for packed sequences (no attention across </s> boundaries):
  #   sdpa_mask -- a (B,1,T,T) boolean mask per batch; works everywhere, but costs ~4-5 GiB of
  #                activation memory per sample and forces SDPA's slower masked kernel.
  #   flex      -- FlexAttention block mask (torch >= 2.5): no T x T tensor, cross-document blocks
  #                are skipped. Same result; verify with a TEST_RUN first (HOW_TO_RUN.md 2.9).
  attention_impl: "sdpa_mask"
  dtype: "bf16"  # autocast/compute precision
  # dtype the parameters, gradients and optimizer state are HELD in. float32 = master weights
  # (recommended): updates smaller than bf16's ~0.4% resolution are otherwise silently lost,
  # which at small learning rates is most of them. Costs ~3 GiB/GPU, negligible vs activations.
  param_dtype: "float32"
  hf_push_interval: 100
  # Threshold on the parameter-count-weighted relative L2 norm across all
  # layers vs. model.reference_repo -- above this, the whole model is
  # flagged as suspiciously different in the startup reference_weight_check
  # log line (see Trainer._verify_reference_weights). A fully-random/
  # reinitialized model lands around sqrt(2) ~= 1.41; 0.5 sits well below
  # that but above expected healthy training drift. No effect if
  # model.reference_repo is blank.
  reference_weight_deviation_threshold: 0.5
  # init_from controls MODEL WEIGHTS only: "hf" pulls model.repo_name from the
  # HF Hub; "resume" loads the latest local checkpoint's weights instead (see
  # resume_run_dir below). Regardless of this setting, optimizer state,
  # iter_num, best_val, and (since they're pure functions of iter_num) the LR
  # and dynamic sampling-ratio schedules ALWAYS auto-resume from the latest
  # checkpoint when one exists -- e.g. init_from: "hf" still continues the
  # step count/optimizer momentum from a prior local run while pulling fresh
  # weights, which is intentional for continuous pretraining across Modal
  # container restarts.
  init_from: "resume"  # hf (HuggingFace hub) | resume (local ckpt); use "resume" with fresh_start
  # Optional explicit override; leave blank to auto-discover the most recent
  # matching run directory under training.out_dir (works the same on a Modal
  # Volume, a vast.ai instance's local disk, or your own machine -- purely a
  # filesystem scan, no platform-specific logic -- as long as out_dir points
  # at somewhere that actually persists across restarts there).
  resume_run_dir: ""
  # Two checkpoints are tracked per run: "latest" (ckpt_{iter_num}/
  # resume_state, saved on every eval regardless of loss) and "best"
  # (ckpt_best/resume_state_best, only updated when val loss improves on
  # its own best). This picks which one to actually resume from -- "best"
  # rewinds iter_num/the LR+sampling schedule to wherever that best eval
  # happened, "latest" continues from wherever training last stopped even
  # if loss had gotten worse since the best point.
  resume_from: "latest"  # latest | best
  # If true, skip the local-vs-S3 recency comparison in Trainer._setup_dirs
  # and always resume from S3 when it has any checkpoint -- useful when
  # training across multiple Modal accounts/volumes where "local" state on
  # whichever account you're on right now may just be stale or absent, and
  # S3 is the actual shared source of truth. Overridable per-invocation via
  # the FORCE_S3_RESUME env var (checked first) without editing this file.
  force_download_from_s3: false
  # Manual last-resort override: forces iter_num to this value regardless of
  # what any local/S3 checkpoint's trainer_state.json says (even if none is
  # found at all) -- for when a checkpoint's weights made it to HF but its
  # matching training state never made it to S3 (e.g. a free Modal account
  # running out of credit before the state could be pushed). Leave blank for
  # normal auto-resume behavior. This is a ONE-TIME correction, not a floor:
  # once set, EVERY restart forces iter_num back to this exact value,
  # silently discarding any real progress made since -- clear it back to
  # blank once checkpointing is confirmed working again.
  last_step: 
  # Start at step 0 (warmup, LR schedule, scheduled sampling, best-val and HF-push tracking all
  # restart) while still loading the latest checkpoint's weights and, if the optimizer is the
  # same one, its state. Writes to a NEW run dir; applied once (a restart resumes the new run).
  # Env override: FRESH_START=1. Note Adam's moments re-estimate in ~20 steps (beta2=0.95), so
  # carrying them over saves little; set resume_optimizer_state: false to skip it.
  fresh_start: true
  resume_optimizer_state: true
  mode: "pretrain"  # pretrain | sft
  # Dry run: load the model + model.reference_repo, run the startup
  # weight-deviation check AND the side-by-side generation comparison
  # (5 prompts x {do_sample, beam search} x {this model, reference model},
  # 150 new tokens each -- see Trainer._startup_generation_comparison), then
  # run ONE eval, log its loss plus the delta against the best val loss
  # recorded in the checkpoint's trainer_state.json, and STOP
  # (Trainer._test_run_eval). No training step, and nothing saved locally,
  # uploaded to S3, or pushed to the HF Hub. Set back to false to train.
  # Overridable per-invocation via the TEST_RUN env var (checked first), so
  # you can do a dry run without editing this file:
  #   TEST_RUN=1 python -m training.new_train     # dry run, whatever is set here
  #   TEST_RUN=0 python -m training.new_train     # really train
  test_run: true
  hf_chkpt_path: "Aletheia-ng/SabiYarn_MoE-280M"
  # Hand-written probe set (one {"lang","text"} per line), scored at every eval and
  # logged as curated_eval / mlflow curated/*. Independent of the train/val bins:
  # if its loss is far below train/val loss, suspect the bins, not the model.
  curated_eval_path: "data/curated_eval.jsonl"  # blank to disable; CURATED_EVAL_PATH env overrides
  schedule_trainable_layers: false

tokenizer:
  name: BeardedMonster/SabiYarn-32k
  num_proc: 64
  process_one_file_at_a_time: true

model:
  # local = build the network from this repo's sabiyarn/model/modeling.py and load only the weights
  # from repo_name (reproducible, testable). hub = use the modeling.py stored on the Hub next to the
  # weights (changes whenever someone pushes there; local edits have no effect until pushed).
  code: local
  # sparse = each expert only processes the tokens routed to it (~half the expert FLOPs and memory
  # for top-2 of 4); dense = every expert processes every token. Identical math.
  moe_dispatch: sparse
  repo_name: Aletheia-ng/SabiYarn_MoE-280M #Aletheia-ng/SabiYarn_MoE_base
  # Static, manually-maintained reference checkpoint for the last-line
  # weight-deviation sanity check (see Trainer._verify_reference_weights) --
  # NOT auto-updated by training code. Leave blank to disable the check.
  reference_repo: "Aletheia-ng/sabiyarn-ref"
  weights:
    freeze_experts_only: false
    freeze_pos_layer_only: false
    freeze_emb_layer_only: false
    freeze_router_layer_only: false
    freeze_ffn_layer_only: false
    freeze_attn_layer_only: false

s3:
  # Credentials are NOT stored here. Set S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY
  # as env vars locally, or via the Modal "s3-secret" secret in production.
  s3_endpoint: https://usc1.contabostorage.com
  s3_bucket_name: sabiyarn-dataset

# wandb logging
wandb: 
  log : true  # disabled by default
  project : sabiyarn-ablations
  run_name : ablation_1  # 'run' + str(time.time())
  save_model_to_wandb: true
  seed: 42

# mlflow logging (works alongside wandb)
mlflow:
  log: true
  # Where runs are stored. The MLFLOW_TRACKING_URI env var overrides this.
  # Leave null for ./mlruns (vast.ai); modal_train.py points it at the volume.
  tracking_uri: null
  experiment: sabiyarn-ablations
  run_name: null            # null -> "<wandb.run_name>_<mode>"
  run_id: null              # or MLFLOW_RUN_ID env: continue the same run after a resume
  log_system_metrics: true  # GPU util/memory, CPU, RAM charts
  # Serve the MLflow UI from the training process itself (background subprocess,
  # stopped when training ends). Equivalent to running:
  #   MLFLOW_ALLOW_FILE_STORE=true mlflow ui --backend-store-uri mlruns --host 0.0.0.0 --port 5000
  # Then tunnel the port from your laptop (vast.ai):
  #   ssh -N -L 5000:localhost:5000 -p <vast_ssh_port> root@<vast_ip>  ->  http://localhost:5000
  # Overrides: MLFLOW_UI_ENABLED=0/1, MLFLOW_UI_PORT. Skipped on Modal (container isn't reachable)
  # and when tracking_uri is an http(s) server.
  ui:
    enabled: true
    host: 0.0.0.0
    port: 5000

# data
data: 
  pretrain_datasets: 
    african:
      - BeardeMonster/african_SFT
    english:
      - BeardedMonster/english_SFT
  sft_datasets:
    african: 
      - BeardedMonster/african_sft
    english:
      - BeardedMonster/eng_sft
  rl_datasets:
      - Aletheia-ng/tds-sft
  pretrain:
    - eng_train_data_path : "datasets/eng_training.bin"
    - afr_train_data_path : "datasets/training_cleaned.bin"
    # TEMPORARY for smoke testing: validation.bin doesn't exist in the S3
    # bucket. Pointing eval at an existing training bin just unblocks the
    # pipeline check -- this is NOT a real held-out eval set. Restore to
    # "validation.bin" (or a real eval split) before actual training.
    - eval_data_path: "datasets/validation.bin"
  sft:
    - eng_train_data_path : "datasets/eng_sft_training.bin"
    - afr_train_data_path : "datasets/nigerian_sft_training.bin"
    - eval_data_path: "sft_validation.bin"
  sampling:
    - use_scheduled_sampling: true
    - afr_sampling_weight: 0.45
    - eng_sampling_weight: 0.55
 

# optimizer
optimizer:
  # adamw | muon. Muon (hidden matrices) + AdamW (embeddings, norms, router) needs DDP or one
  # GPU -- not FSDP -- and reuses the AdamW lr / weight_decay below unchanged. Independent
  # benchmarks (Wen et al. 2025) find its edge over a well-tuned AdamW shrinking with scale and
  # at high tokens-per-parameter, so A/B it on ~300M tokens before committing a long run.
  name : "adamw"
  learning_rate : 6e-4  # peak. ~4e-4..1e-3 is the range for 0.1-1B models; sweep {4e-4, 6e-4, 1e-3}
  max_tokens : 50e9  # token budget -> max_iters is derived at startup from the real tokens/step
  max_iters : 60000  # fallback if max_tokens is 0
  weight_decay : 1e-1
  beta1 : 0.9
  beta2 : 0.95
  muon_momentum : 0.95
  muon_ns_steps : 5
  muon_rms : 0.2  # update RMS matched to AdamW (Moonlight); makes lr/wd transfer from AdamW
  grad_clip : 1.0  # clip gradients at this value, or disable if :: 0.0
  moe_aux_loss_weight: 0.015  # was 0.01 -- raised to push harder against router imbalance


# DDP settings
ddp:
  rank : 0
  backend : "nccl"
  use_dp: false

#Accelerate config
accelerate:
  mixed_precision: "bf16"
  fsdp_sharding_strategy: "FULL_SHARD"  # NO_SHARD | SHARD_GRAD_OP | FULL_SHARD | HYBRID_SHARD
  gradient_clipping: 1.0

env:
  world_size: 1
  rank: 0

modal:
  # gpu_type/gpus_per_node/num_nodes here ONLY configure Modal's
  # @app.function(gpu=...) parameter (training/modal_train.py) -- they have
  # no effect if you're running on vast.ai or any other bare GPU box instead.
  # There, you pick/rent the hardware yourself when provisioning the
  # instance, and gpus_per_node's number is just what you'd manually pass to
  # torchrun's --nproc_per_node (see HOW_TO_RUN.md's generic launch command).
  #
  # Valid gpu_type strings on Modal, with VRAM per GPU (confirmed against
  # Modal's own docs at https://modal.com/docs/guide/gpu; double check
  # modal.com/pricing for current availability/pricing before committing to
  # one, especially the newer/less common entries):
  #   T4            16 GB
  #   L4            24 GB
  #   A10           24 GB
  #   L40S          48 GB
  #   A100-40GB     40 GB  (also just "A100")
  #   A100-80GB     80 GB
  #   H100          80 GB  (also "H100!" -- a specific availability SKU)
  #   H200         141 GB
  #   RTX-PRO-6000  -- newer card, check current Modal docs for VRAM
  #   B200/B200+    -- newer card, check current Modal docs for VRAM
  #   B300          -- newer card, check current Modal docs for VRAM
  #
  # A single gpu_type string requests that many of that type (e.g. "L40S:2"
  # via gpus_per_node: 2 below); num_nodes > 1 additionally requires
  # gpus_per_node to be the FULL device count Modal offers per physical host
  # for that type (see the clustered() note in training/modal_train.py).
  num_nodes: 1
  gpus_per_node: 4
  gpu_type: "A100-80GB"  # 48 GB -- change freely, see the list above